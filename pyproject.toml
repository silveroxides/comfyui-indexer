[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfyui-indexer"
version = "0.2.0"
description = "A metadata indexer for ComfyUI-generated images with search, CLI, and WebUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ComfyUI Indexer Contributors" }
]
keywords = ["comfyui", "metadata", "indexer", "image", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pillow>=10.0.0",
    "rapidfuzz>=3.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
comfy-idx = "comfyui_indexer.cli:app"

[project.urls]
Homepage = "https://github.com/comfyui-indexer/comfyui-indexer"
Repository = "https://github.com/comfyui-indexer/comfyui-indexer"

[tool.hatch.build.targets.wheel]
packages = ["comfyui_indexer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
